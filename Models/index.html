<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Safe Travel Sri Lanka Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a model switcher bar on top, then one of four applications drawn from the same sample data.
   Look follows the existing Safe Travel prototypes: warm paper ground, ink, one signal red. Single light theme by choice. */
:root{
  --bg:#f6f4ef; --card:#ffffff; --soft:#f1eee8; --line:#e3ded4; --ink:#1c1b19; --ink2:#3a3733; --mute:#6b665e;
  --red:#e3262f; --red-d:#c41f28; --red-soft:#fde3e3; --ok:#1f7a4d; --ok-soft:#e2f1e5; --warn:#9a6200; --warn-soft:#f8ecd6; --info:#2456a6; --info-soft:#e4ecf8;
  --t-blue:#e4ecf8; --t-teal:#ddf0ef; --t-green:#e2f1e5; --t-rose:#fde3e3; --t-sand:#f8ecd6; --t-olive:#e8eedb;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif; --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:16px; --r-s:12px; --gut:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:500}
.mute{color:var(--mute)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}

/* buttons, chips, pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-s);padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}.btn-red:hover{background:var(--red-d);border-color:var(--red-d)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn-ghost{background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--red-soft);color:var(--red-d)} .pill.info{background:var(--info-soft);color:var(--info)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 11px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* model switcher */
.mbar{background:var(--ink);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--ink)}
.mbar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px}
.mbar b{font-family:var(--display);font-size:16px;letter-spacing:-.01em}
.mtabs{display:flex;gap:4px;flex-wrap:wrap}
.mtabs button{border:0;background:transparent;color:#cfcac0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.mtabs button[aria-selected="true"]{background:#fff;color:var(--ink)}
.mbar .reset{border:1px solid #55514a;background:transparent;color:#cfcac0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.mnote{background:var(--warn-soft);color:#5c3c00;font-size:13px}
.mnote .wrap{padding-block:6px}

/* ---------- web portal ---------- */
.ebar{background:#11100f;color:#fff;font-size:13px}
.ebar .wrap{display:flex;gap:16px;flex-wrap:wrap;padding-block:7px;align-items:center}
.ebar .hot{color:#ff8d92;font-weight:700}
.ebar b{font-variant-numeric:tabular-nums}
.phead{background:var(--bg);border-bottom:1px solid var(--line)}
.phead .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:12px}
.logo{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;border:0;background:none;padding:0;text-align:left}
.logo .mk{width:36px;height:36px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:18px}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--mute);letter-spacing:0}
.pnav{display:flex;gap:2px;flex-wrap:wrap}
.pnav button{border:0;background:none;padding:7px 10px;border-radius:10px;font-weight:600;font-size:14px}
.pnav button[aria-current="page"]{background:var(--soft)}
.hero{position:relative;color:#fff;background:#2a211c url(img/hero-sigiriya.jpg) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,14,10,.82),rgba(20,14,10,.35) 60%,rgba(20,14,10,.2))}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:end;padding-block:56px}
.hero h1{font-size:clamp(34px,5.6vw,68px);font-weight:800;letter-spacing:-.045em;line-height:.96}
.hero p{font-size:17px;max-width:46ch;margin-top:16px;color:#f1ece4}
.hero .badge{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;margin-bottom:16px}
.live{background:rgba(24,22,20,.82);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.live h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;flex:none}
.dot.blue{background:#4c86e0}.dot.amber{background:#e0a02c}
.al{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start}
.al .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#cfcac0}
.al b{font-size:14px;line-height:1.3}
.srcs{border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.srcs .wrap{display:flex;gap:22px;flex-wrap:wrap;padding-block:14px;align-items:center}
.sec{padding-block:48px}
.sec h2{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.035em;margin-top:8px}
.sec .lead{color:var(--ink2);max-width:60ch;margin-top:10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
button.lcard:hover{border-color:var(--ink)}
.lcard .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.lcard h3{font-family:var(--body);font-size:16px;font-weight:700;letter-spacing:0;line-height:1.25}
.lcard .meta{font-size:13px;color:var(--mute)}
.tcard{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.tcard .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px}
.tcard h3{font-size:18px;font-weight:700}
.tone-blue{background:var(--t-blue)}.tone-teal{background:var(--t-teal)}.tone-green{background:var(--t-green)}.tone-rose{background:var(--t-rose)}.tone-sand{background:var(--t-sand)}.tone-olive{background:var(--t-olive)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.big{border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.big h3{font-size:26px;font-weight:800;letter-spacing:-.03em}
.spons{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.spon{border:1px solid var(--line);background:var(--card);border-radius:var(--r-s);padding:12px 16px}
.spon b{font-family:var(--display);font-size:20px;display:block}
.pfoot{background:#11100f;color:#d8d3c9;font-size:13px;margin-top:24px}
.pfoot .wrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:space-between;padding-block:28px}
.pfoot table{border-collapse:collapse}.pfoot td{padding:2px 14px 2px 0}.pfoot td:last-child{font-weight:700;color:#fff;text-align:right}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.filters .inp{max-width:280px}
.amounts{display:flex;gap:8px;flex-wrap:wrap}

/* map */
.map{background:#dfe9ee;border:1px solid var(--line);border-radius:24px;padding:18px;position:relative;display:grid;place-items:center;min-height:320px}
.map-in{position:relative;height:420px;aspect-ratio:62/100;max-width:100%}
.map-s .map-in{height:300px}.map-s{min-height:0;border-radius:18px;padding:12px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map polygon{fill:#f6f4ef;stroke:#b9c7cf;stroke-width:.6}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:var(--ink);font-size:13px;display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin:hover{background:var(--red);z-index:2}
.map-note{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--mute);background:rgba(255,255,255,.8);padding:2px 8px;border-radius:999px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(17,16,15,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:20px;max-width:520px;width:100%;max-height:90%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:24px;font-weight:800}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;z-index:70;max-width:calc(100% - 32px)}

/* ---------- admin + supplier ---------- */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:640px}
.side{background:#11100f;color:#d8d3c9;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .who{padding:6px 10px 14px;font-size:12px;color:#a7a299}
.side .who b{display:block;color:#fff;font-family:var(--display);font-size:16px}
.side button{border:0;background:none;color:inherit;text-align:left;padding:8px 10px;border-radius:10px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.side button[aria-current="page"]{background:#fff;color:var(--ink)}
.side .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.main{padding:22px max(16px, env(safe-area-inset-right, 0px)) 40px 22px;min-width:0}
.main h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.main .sub{color:var(--mute);margin-top:4px;max-width:70ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{font-family:var(--display);font-size:30px;letter-spacing:-.03em;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;min-width:0}
.panel>header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h3{font-family:var(--body);font-size:15px;font-weight:700;letter-spacing:0}
.panel .body{padding:16px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{text-align:left;font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;padding:10px 16px;white-space:nowrap}
.t td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:middle}
.t td .small{display:block}
.t .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.sw{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.sw input{width:38px;height:22px;accent-color:var(--red)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.step{flex:1 1 150px;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:var(--card);font-size:13px}
.step b{display:block;font-size:14px}.step.done{background:var(--ok-soft);border-color:transparent}.step.now{border-color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
.bars i{flex:1;background:var(--ink);border-radius:4px 4px 0 0;min-width:6px}
.bars i:last-child{background:var(--red)}

/* ---------- mobile ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:center;padding-block:32px}
.stage h2{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.035em}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.phone{width:340px;max-width:100%;height:690px;background:#11100f;border-radius:46px;padding:10px;box-shadow:0 24px 60px rgba(28,27,25,.28)}
.screen{background:var(--bg);border-radius:37px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;padding:12px 24px 4px;font-weight:700;font-size:13px}
.scr{flex:1;overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.scr>*{flex:none}
.scr h3{font-size:26px;font-weight:800;letter-spacing:-.035em}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px 12px}
.tabbar button{border:0;background:none;font-size:10px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
.tabbar button span{font-size:19px}
.tabbar button[aria-current="page"]{color:var(--red)}
.tabbar .sos span{background:var(--red);color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:-14px;border:3px solid var(--card)}
.acard{border-radius:var(--r);padding:12px 14px;background:var(--red-soft)}
.acard.blue{background:var(--t-blue)}.acard.amber{background:var(--t-sand)}
.acard .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.acard b{display:block;line-height:1.3}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex:none}
.hs .chip{flex:none}
.mrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.mrow .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.mrow b{display:block;font-size:14px;line-height:1.25}.mrow small{color:var(--mute)}
.sosbtn{width:170px;height:170px;border-radius:50%;border:10px solid var(--red-soft);background:var(--red);color:#fff;font-family:var(--display);font-size:40px;font-weight:800;align-self:center;margin:8px 0}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px 20px;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:82%;overflow:auto;display:flex;flex-direction:column;gap:10px;z-index:3}
.sheet-bg{position:absolute;inset:0;background:rgba(17,16,15,.45);z-index:2;border:0}

@media (max-width:860px){
  .hero .wrap,.split,.duo,.stage{grid-template-columns:minmax(0,1fr)}
  .stage{justify-items:center}
  .adm{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;padding:8px var(--gut-r) 8px var(--gut)}
  .side .who{display:none}.side button{flex:none}
  .main{padding:18px var(--gut-r) 32px var(--gut)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:90px minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.pin,.lcard{transition:border-color .15s,background .15s}}
</style>
</head>
<body>

<div class="mbar">
  <div class="wrap">
    <b>Safe Travel Sri Lanka</b>
    <div class="mtabs" role="tablist" aria-label="Application">
      <button type="button" role="tab" data-app="portal">Web Portal</button>
      <button type="button" role="tab" data-app="mobile">Mobile App</button>
      <button type="button" role="tab" data-app="admin">Admin Portal (Internal)</button>
      <button type="button" role="tab" data-app="supplier">Admin Portal (Supplier)</button>
    </div>
    <span class="sp"></span>
    <button type="button" class="reset" data-act="reset">Reset sample data</button>
  </div>
</div>
<div class="mnote"><div class="wrap">Model with sample data. Approve a supplier, publish an alert or edit the home page in the admin portals, then open the Web Portal or Mobile App to see it change.</div></div>

<main id="app"></main>
<div id="overlay"></div>

<script src="data.js"></script>
<script src="portal.js"></script>
<script src="mobile.js"></script>
<script src="admin.js"></script>
<script src="supplier.js"></script>
<script src="main.js"></script>
</body>
</html>
